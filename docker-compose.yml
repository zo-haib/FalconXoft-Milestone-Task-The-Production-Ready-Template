services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: template_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Ensure the app always talks to the "db" service name on the
      # Docker network, regardless of what's in .env for local runs.
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - backend

  db:
    image: postgres:16-alpine
    container_name: template_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-app_db}
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app_user} -d ${DB_NAME:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    # No ports published to the host on purpose -- only the API and Nginx
    # need to reach Postgres, via the internal "backend" network.

  nginx:
    image: nginx:1.27-alpine
    container_name: template_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - backend

volumes:
  pgdata:
    driver: local

networks:
  backend:
    driver: bridge
